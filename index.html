<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            GAMEVAULT
        </div>

        <nav>
            <a href="#">Store</a>
            <a href="#">Discover</a>
            <a href="#">Community</a>
        </nav>

        <div class="nav-actions">
            <input
                type="text"
                placeholder="Search games..."
            >
            <button>Cart</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <p class="hero-label">FEATURED GAME</p>
                <h1>Cyberpunk 2077</h1>
                <p class="hero-description">Explore Night City in this open-world action RPG</p>
                <button class="hero-button">View Game</button>
            </div>
            <div class="hero-image">
                <img
                    src="https://images.unsplash.com/photo-1542751371-adc38448a05e"
                    alt="Gaming setup"
                >
            </div>
        </section>
        <section class="featured-games">
            <h2>Featured Games</h2>
            <div class="game-grid">
                <article class="game-card">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="Cyberpunk 2077">
                    <div class="game-info">
                        <h3>Cyberpunk 2077</h3>
                        <p>Open-world action RPG</p>
                        <div class="game-bottom">
                            <span>$29.99</span>
                            <button>Add to Cart</button>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>


</body>
</html>
